<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Event Room Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Smart Event Room Management System</h1>
    <div class="card">
        <h2>Add Event</h2>
        <form>
            <input type="text" placeholder="Event Name">
            <input type="time">
            <input type="time">

            <select>
                <option>Priority 1</option>
                <option>Priority 2</option>
                <option>Priority 3</option>
                <option>Priority 4</option>
                <option>Priority 5</option>
                <option>Priority 6</option>
                <option>Priority 7</option>
                <option>Priority 8</option>
                <option>Priority 9</option>
                <option>Priority 10</option>
            </select>

            <button type="button">Allocate Room</button>
        </form>
    </div>
    <div class="card">
        <h2>Allocated Events</h2>
        <table>
            <tr>
                <th>Room</th>
                <th>Event</th>
                <th>Priority</th>
            </tr>

            <tr>
                <td>R001</td>
                <td>Hackathon</td>
                <td>10</td>
            </tr>

            <tr>
                <td>R002</td>
                <td>Web Development</td>
                <td>9</td>
            </tr>

            <tr>
                <td>R003</td>
                <td>Python Seminar</td>
                <td>8</td>
            </tr>

        </table>

    </div>
    <div class="card">
        <h2>Waiting List</h2>
        <ul>
            <li>No Waiting Events</li>
        </ul>

    </div>

</div>

</body>
</html>
